name: shuttle-dev

services:
  db:
    image: mysql:8.0
    volumes:
      - mysql_data_dev:/var/lib/mysql
    env_file:
      - .env.dev
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shuttle}
      MYSQL_USER: ${MYSQL_USER:-shuttle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shuttle_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shuttle_root_password}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./manage.py:/app/manage.py
      - ./config:/app/config
      - ./accounts:/app/accounts
      - ./shuttle:/app/shuttle
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_initial_admin &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend
    networks:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - backend

volumes:
  mysql_data_dev:
  frontend_node_modules:

networks:
  backend:
